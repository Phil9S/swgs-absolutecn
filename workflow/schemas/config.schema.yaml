$schema: "https://json-schema.org/draft/2020-12/schema"

description: snakemake configuration file

type: object

# possible entries of the config file and which type they should be
properties:
  samples:
    type: string
  out_dir:
    type: string
  bins:
    type: number 
    enum: [1,5,15,30,50,100,500,1000]
    uniqueItems: true
  project_name:
    type: string
  af_cutoff:
    type: number
    minimum: 0
    maximum: 1.0
  use_seed:
    type: string
    enum: ["TRUE","FALSE"]
  seed_val:
    type: string
  filter_underpowered:
    type: string
    enum: ["TRUE","FALSE"]
  ploidy_min:
    type: number
    minimum: 1
    maximum: 20
  ploidy_max:
    type: number
    minimum: 1
    maximum: 20
  purity_min:
    type: number
    minimum: 0
    maximum: 1.0
  purity_max:
    type: number
    minimum: 0
    maximum: 1.0
  filter_homozygous:
    type: string
    enum: ["TRUE","FALSE"]
  homozygous_prop:
    type: number
    minimum: 0
  homozygous_threshold:
    type: number
    minimum: 0
    maximum: 0.99
  image_base_url:
    type: string
  genome:
    type: string
    enum: ["hg19","hg38"]
  filetype:
    type: string
    enum: ["CRAM","BAM"]
  reference:
    type: string
  pairedEnd:
    type: string
    enum: ["TRUE","FALSE"]
  autoSmooth:
    type: string
    enum: ["TRUE","FALSE"]
  smoothThreshold:
    type: number
    minimum: 44
    maximum: 9999
  flagThreshold:
    type: number
    minimum: 0
    maximum: 0.99
  fitMethod:
    type: string
    enum: ["randforest","errorOnly"]
  errorMetric:
    type: string
    enum: ["clonality","segvariance","rmse"]
  computeSigs:
    type: string
    enum: ["TRUE","FALSE"]

# entries that have to be in the config file for successful validation
required:
  - samplesheet
  - out_dir
  - bins
  - project_name
  - use_seed
  - seed_val
  - filter_underpowered
  - ploidy_min
  - ploidy_max
  - purity_min
  - purity_max
  - filter_homozygous
  - homozygous_prop
  - homozygous_threshold
  - genome
  - filetype
  - pairedEnd
  - autoSmooth
  - smoothThreshold
  - flagThreshold
  - fitMethod
  - errorMetric
  - computeSigs

