[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    dryrun: fast dry-run checks of config, sample sheet and DAG - no test data needed
    integration: full workflow runs on the Zenodo NA12878 BAM (slow, ~650 MB download once)
    cram: CRAM conversion tests (downloads the GRCh37 chr21 reference)
    container: workflow runs with --sdm apptainer (skipped without apptainer/singularity)
    cinsig: CIN signature tests (skipped without CINSignatureQuantification or SWGS_TEST_CINSIG_IMAGE)
