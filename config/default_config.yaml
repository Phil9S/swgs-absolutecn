---
# Sample sheet
samplesheet: "config/sample_sheet.tsv"

# Output location
out_dir: "results/"

# Bin sizes
# By default any in [1,5,15,30,50,100,500,1000]
bins: 30
project_name: "example_run"

# Pipeline parameters
af_cutoff: 0.15

# Set seed for CBS - TRUE or FALSE
# default TRUE
use_seed: 'TRUE'
seed_val: '9999'

# fitler underpowered solutions - TRUE or FALSE
# Default TRUE
filter_underpowered: 'FALSE'

# ploidy range
# Default min = 1.6 | max = 8
ploidy_min: 1.6
ploidy_max: 8.0

# purity range (1 >= max > min >= 0)
# Default min = 0.15 | max = 1.00
purity_min: 0.15
purity_max: 1.0

# Homozygous loss filter - TRUE or FALSE
# Default "TRUE"
filter_homozygous: 'TRUE'

# Threshold basepairs lost
# Default 10000000 / 10Mbase
homozygous_prop: 10000000

# Absolute CN homozygous loss threshold
# Default 0.4
homozygous_threshold: 0.4

# container url for swgs-absolutecn
workflowimage: phil9s/swgs-absolutecn:latest

# genome build - either hg19 or hg38
genome: "hg19"

# filetype - BAM or CRAM
# Default 'BAM'
filetype: "BAM"

# reference - reference used in CRAM generation for conversion back to BAM
reference: ""

# Read data paired end or single end - only affects calculation of expected variance in QDNASeq
# Default TRUE
pairedEnd: 'TRUE'

# automatically smooth profiles with segment counts above smoothThreshold
# Default - 'FALSE' / 300 segments
autoSmooth: 'FALSE'
smoothThreshold: 300

# autofit profiles
## flagthresold determines at what potint samples are flagged as potentially poor fits
flagThreshold: 0.84 # default 0.84

# method for selecting best fit - either 'randforest' model or lowest error 'errorOnly'
fitMethod: "errorOnly"

# errorMetric for errorOnly fitting and tiebreaker procedure in randforest
## Either 'clonality', 'segvariance' or 'rmse'
errorMetric: "clonality"

# Compute CIN signatures (auto only)
## Default FALSE
computeSigs: 'TRUE'
